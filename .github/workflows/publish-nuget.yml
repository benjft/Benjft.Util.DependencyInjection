name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-pack-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
  
      - name: Pack
        run: dotnet pack Benjft.Util.DependencyInjection/Benjft.Util.DependencyInjection.csproj --configuration Release --output ./nupkgs -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}
  
      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{secrets.GITHUB_TOKEN}} --source https://nuget.pkg.github.com/benjft/index.json --skip-duplicate
  
      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
  
      - name: Generate release notes from PR descriptions
        id: rel_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentTag = context.ref.replace('refs/tags/', '');
            let latestRelease = null;
            try {
              latestRelease = await github.rest.repos.getLatestRelease({ owner, repo });
            } catch (e) {
              // No previous releases
            }
            const since = latestRelease?.data?.published_at ?? '1970-01-01T00:00:00Z';
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const base = repoInfo.data.default_branch;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base,
              per_page: 100,
            });
            const merged = pulls.filter(pr => pr.merged_at && new Date(pr.merged_at) > new Date(since));
            merged.sort((a, b) => new Date(a.merged_at) - new Date(b.merged_at));
            let body = `Release ${currentTag}\n\n`;
            body += `This release includes ${merged.length} merged pull request(s) since ${since}:\n\n`;
            for (const pr of merged) {
              body += `- #${pr.number} ${pr.title}\n`;
              if (pr.body) {
                body += `${pr.body}\n\n`;
              } else {
                body += `\n`;
              }
            }
            core.setOutput('body', body);
  
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.rel_notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./nupkgs/*.nupkg
