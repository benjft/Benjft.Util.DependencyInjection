name: Build and Test
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  upload-coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload Coverage
        uses: ./.github/actions/upload-coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: 'Benjft.Util.DependencyInjection.Tests/TestResults/*/coverage.info'
